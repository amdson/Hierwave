[project]
name = "castlegen"
version = "0.0.1"
description = "Fixed-budget hierarchical sampling of tile worlds with learned coarse levels (see notes/constitution.md)"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy", "scipy", "numba", "matplotlib"]

[project.optional-dependencies]
render = ["pillow"]
dev = ["pytest", "pillow"]

[tool.setuptools.packages.find]
include = ["castlegen*"]

[tool.setuptools.package-data]
"castlegen.legacy" = ["tilesets/*.json", "tilesets/img/*.png", "exemplars/*.json", "exemplars/*.npy", "pipelines/*.json"]
castlegen = ["csrc/*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
