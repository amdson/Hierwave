[project]
name = "castlegen"
version = "0.0.1"
description = "Fixed-budget hierarchical Boltzmann sampling of tile-grid castles (JAX)"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
