# Repo-local Luanti config for the Hierwave game (see luanti/README.md).
# Used via --config by luanti/run.sh; your own ~/Library config is not read.

# mapgen: hierwave_gen fills everything; 64^3 mapchunks
mg_name = singlenode
chunksize = 4
fixed_map_seed = 1

# mod security stays on; hierwave_gen may use the insecure env (LuaJIT FFI)
secure.enable_security = true
secure.trusted_mods = hierwave_gen

# viewer
creative_mode = true
enable_damage = false
default_privs = interact, shout, fly, fast, noclip, teleport, debug
static_spawnpoint = 4, 0.5, -4
viewing_range = 300
enable_clouds = false
time_speed = 0
world_start_time = 9000
server_announce = false

# hierwave settings (luanti/games/hierwave/mods/hierwave_gen/settingtypes.txt);
# run.sh overrides set and seed from HW_SET / HW_SEED
hierwave_set = biomes
hierwave_seed = 1
hierwave_provider = auto
hierwave_gen_env = auto
hierwave_chunk_tiles = 32
